apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: /snap/kompose/19/kompose-linux-amd64 convert
    kompose.version: 1.21.0 (992df58d8)
  creationTimestamp: null
  labels:
    io.kompose.service: cast-service
  name: {{ .Release.Name }}-cast-service
spec:
  replicas: {{ .Values.castService.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: cast-service
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: /snap/kompose/19/kompose-linux-amd64 convert
        kompose.version: 1.21.0 (992df58d8)
      labels:
        io.kompose.service: cast-service
    spec:
      containers:
      - args:
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        env:
        - name: DATABASE_URI
          value: postgresql://{{ .Values.castDb.username }}:{{ .Values.castDb.password }}@{{ .Release.Name }}-cast-db/{{ .Values.castDb.database }}
        image: {{ .Values.castService.image.repository }}:{{ .Values.castService.image.tag }}
        imagePullPolicy: IfNotPresent
        name: cast-service
        ports:
        - containerPort: 8000
        volumeMounts:
        - mountPath: /app/
          name: cast-service-claim0
      volumes:
      - name: cast-service-claim0
        persistentVolumeClaim:
          claimName: cast-service-claim0

