apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nginx
  labels:
    app: {{ .Release.Name }}-nginx
spec:
  type: ClusterIP  # Change to LoadBalancer if you need external access
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: {{ .Release.Name }}-nginx

