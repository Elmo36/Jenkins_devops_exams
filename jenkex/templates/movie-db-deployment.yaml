apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-movie-db
  labels:
    io.kompose.service: movie-db
spec:
  replicas: {{ .Values.movieDb.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: movie-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: movie-db
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: {{ .Values.movieDb.database }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.movieDb.password }}
        - name: POSTGRES_USER
          value: {{ .Values.movieDb.username }}
        image: postgres:12.1-alpine
        imagePullPolicy: IfNotPresent
        name: movie-db
        volumeMounts:
        - mountPath: /var/lib/postgresql/data/
          name: postgres-data-movie
      volumes:
      - name: postgres-data-movie
        persistentVolumeClaim:
          claimName: postgres-data-movie
